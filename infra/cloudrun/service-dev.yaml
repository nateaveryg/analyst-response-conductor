apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: conductor-v2-dev
  labels:
    app: conductor-v2-dev
    part-of: analyst-response-agent
    functional-type: agent
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: ALPHA
    apphub.cloud.google.com/functional-type: agent
    apphub.cloud.google.com/display-name: "Analyst Response Agent (Conductor v2 Dev)"
    apphub.cloud.google.com/description: "Autonomous multi-agent enterprise response platform for Gartner, Forrester, and IDC analyst evaluations - Development Tier"
spec:
  template:
    metadata:
      labels:
        app: conductor-v2-dev
        part-of: analyst-response-agent
        functional-type: agent
      annotations:
        run.googleapis.com/client.name: cloud-deploy
        run.googleapis.com/functional-type: agent
        run.googleapis.com/identity-type: agent-identity
        run.googleapis.com/identity-certificate-enabled: "true"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cloudsql-instances: riccardo-blog-test-v1:us-central1:genai-rag-db-859a1005
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 3600
      serviceAccountName: conductor-agent@riccardo-blog-test-v1.iam.gserviceaccount.com
      containers:
        - name: conductor-v2
          image: conductor-v2
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2000m"
              memory: "4Gi"
          env:
            - name: VERTEX_AI_PROJECT
              value: "riccardo-blog-test-v1"
            - name: VERTEX_AI_MODEL
              value: "gemini-3.5-flash"
            - name: ENVIRONMENT
              value: "development"
            - name: AGENT_REGISTRY_ENABLED
              value: "true"
            - name: AGENT_FUNCTIONAL_TYPE
              value: "agent"
            - name: AGENT_DISPLAY_NAME
              value: "Analyst Response Agent (Conductor v2 Dev)"
            - name: CLOUD_SQL_INSTANCE_CONNECTION_NAME
              value: "riccardo-blog-test-v1:us-central1:genai-rag-db-859a1005"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: CONDUCTOR_DATABASE_URL
                  key: latest
            - name: SECURITY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: CONDUCTOR_SECURITY_SECRET_KEY
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
