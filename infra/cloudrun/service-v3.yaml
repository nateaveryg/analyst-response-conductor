apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: conductor-v3-prod
  labels:
    app: conductor-v3
    env: prod
    part-of: analyst-response-agent
    functional-type: agent
    runtime: go-cloud-run
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
    apphub.cloud.google.com/functional-type: agent
    apphub.cloud.google.com/display-name: "The Conductor v3 - Production"
    apphub.cloud.google.com/description: "Production environment for Go serverless multi-agent platform"
spec:
  template:
    metadata:
      labels:
        app: conductor-v3
        env: prod
        part-of: analyst-response-agent
        functional-type: agent
        runtime: go-cloud-run
      annotations:
        run.googleapis.com/client.name: cloud-deploy
        run.googleapis.com/functional-type: agent
        run.googleapis.com/identity-type: agent-identity
        run.googleapis.com/identity-certificate-enabled: "true"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cloudsql-instances: riccardo-blog-test-v1:us-central1:genai-rag-db-859a1005
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 3600
      serviceAccountName: conductor-agent@riccardo-blog-test-v1.iam.gserviceaccount.com
      containers:
        - name: conductor-v3
          image: conductor-v3
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: VERTEX_AI_PROJECT
              value: "riccardo-blog-test-v1"
            - name: VERTEX_AI_LOCATION
              value: "us-central1"
            - name: VERTEX_AI_MODEL
              value: "gemini-3.5-flash"
            - name: ENVIRONMENT
              value: "production"
            - name: SERVICE_VERSION
              value: "3.3.2"
            - name: VERIFICATION_MARKER
              value: "v3.3.2-verified"
            - name: AGENT_RUNTIME
              value: "go-cloud-run"
            - name: AGENT_REGISTRY_ENABLED
              value: "true"
            - name: AGENT_FUNCTIONAL_TYPE
              value: "agent"
            - name: AGENT_DISPLAY_NAME
              value: "The Conductor v3 (Production)"
            - name: CLOUD_SQL_INSTANCE_CONNECTION_NAME
              value: "riccardo-blog-test-v1:us-central1:genai-rag-db-859a1005"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: CONDUCTOR_DATABASE_URL
                  key: latest
            - name: SECURITY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: CONDUCTOR_SECURITY_SECRET_KEY
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
