        - /bin/bash
        - -c
        - |
          set -euo pipefail
          FOUND=0
          for candidate in "." ".." "/workspace" "/workspace/source" "/app"; do
            if [ -f "$candidate/infra/cloudrun/verify_cloudrun_v3.sh" ]; then
              cd "$candidate"
              FOUND=1
              break
            fi
