[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
addopts = -v --durations=10 --strict-markers
markers =
    unit: Fast unit tests
    integration: Integration tests with PostgreSQL and Vertex AI
    adversarial: Automated adversarial red-team and UI fuzzing tests
    ui: Playwright browser DOM and user journey tests
