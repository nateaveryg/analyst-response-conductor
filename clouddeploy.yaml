apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: conductor-v2-pipeline
  labels:
    app: conductor-v2
description: Enterprise Dev2Prod Delivery Pipeline for Analyst Response Agent (Conductor v2)
serialPipeline:
  stages:
    - targetId: dev
      profiles:
        - dev
      strategy:
        standard:
          postdeploy:
            actions:
              - postdeploy-e2e-test
    - targetId: staging
      profiles:
        - staging
      strategy:
        standard:
          postdeploy:
            actions:
              - postdeploy-e2e-test
    - targetId: prod
      profiles:
        - prod
      strategy:
        canary:
          runtimeConfig:
            cloudRun:
              automaticTrafficControl: true
          canaryDeployment:
            percentages:
              - 25
              - 50
            postdeploy:
              actions:
                - postdeploy-e2e-test
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: dev
  labels:
    env: dev
    app: conductor-v2
description: Development Environment (Cloud Run - us-central1)
run:
  location: projects/riccardo-blog-test-v1/locations/us-central1
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: staging
  labels:
    env: staging
    app: conductor-v2
description: Staging Pre-Production Environment (Cloud Run - us-central1)
run:
  location: projects/riccardo-blog-test-v1/locations/us-central1
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: prod
  labels:
    env: prod
    app: conductor-v2
description: Production Environment with Approval Gate and Canary Deployment (Cloud Run - us-central1)
requireApproval: true
run:
  location: projects/riccardo-blog-test-v1/locations/us-central1
